name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Static site sanity (index exists, no conflict markers)
        run: |
          test -f index.html
          ! grep -rIl --include='*.html' -E '^(<<<<<<<|>>>>>>>) ' . 
